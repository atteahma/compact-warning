# The checks for driver.py. This is no package: the driver is a single-file uv script.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RET", "ARG", "PL", "PERF",
  "FBT", "ANN", "RUF",
]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = "pyte.*"
ignore_missing_imports = true
